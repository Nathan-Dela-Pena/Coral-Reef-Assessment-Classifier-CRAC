[project]
name = "crac"
version = "0.1.0"
description = "Coral Reef Assessment Classifier - reef health classification and temporal tracking"
requires-python = ">=3.11"

# Kept deliberately small. Add a dependency only when the code that needs it exists.
dependencies = [
    "pyyaml",
    "requests",
    "pandas",
    "numpy",
    "duckdb",
]

[project.optional-dependencies]
# Phase 2 only. Installing torch is slow; don't pull it in until you start training.
model = [
    "torch",
    "torchvision",
    "scikit-learn",
    "pillow",
    "matplotlib",      # confusion-matrix plot written next to the weights
]
# Phase 4 only.
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",  # required by FastAPI for the /classify file upload
    "pillow",
]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "matplotlib",
    "pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crac*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so CI does not drift with ruff's default rule set.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection requires calls in argument defaults.
"crac/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
